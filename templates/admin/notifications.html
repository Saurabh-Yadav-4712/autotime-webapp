{% extends 'shared/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>🔔 Admin Notifications</h2>
    <div class="list-group mt-3">
        {% for notif in notifications %}
        <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-start shadow-sm mb-2 rounded border-left-primary">
            <div class="ms-2 me-auto">
                <div class="fw-bold">System Alert</div>
                {{ notif.message }}
            </div>
            <span class="badge bg-primary rounded-pill">{{ notif.created_at.strftime('%d %b %H:%M') }}</span>
        </div>
        {% else %}
        <div class="alert alert-info">No notifications yet.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
