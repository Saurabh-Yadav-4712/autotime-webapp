{% extends 'shared/base.html' %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card p-5 border-0 shadow-lg w-100" style="max-width: 500px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary mb-1"><i class="bi bi-mortarboard me-2"></i>Student Registration</h3>
            <p class="text-muted small">Create your student account</p>
        </div>

        <form action="/register_student" method="POST">
            <div class="mb-3">
                <label class="form-label">Institute Code</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-hash"></i></span>
                    <input type="text" name="inst_code" id="inst_code" class="form-control" required placeholder="e.g. INS-XXXXX">
                    <span class="input-group-text bg-white d-none" id="inst_code_spinner">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    </span>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="name" class="form-control" required placeholder="John Doe">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Select Course / Class</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-journal-bookmark"></i></span>
                    <select name="class_id" id="class_id" class="form-select" required disabled>
                        <option value="" disabled selected>Enter Institute Code first...</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" required placeholder="student@example.com">
                </div>
                <div class="form-text">We will send an OTP to this email for verification.</div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" name="password" id="regStudentPwd" class="form-control border-end-0" required minlength="6">
                    <span class="input-group-text bg-white toggle-password border-start-0" data-target="regStudentPwd">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3 py-2">Continue to Verification</button>
        </form>
        <div class="text-center">
            <p class="small text-muted mb-0">Already registered? <a href="/login" class="text-primary text-decoration-none fw-bold">Login Here</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block modals %}
<script>
document.addEventListener('turbo:load', function() {
    const instCodeInput = document.getElementById('inst_code');
    const classSelect = document.getElementById('class_id');
    const spinner = document.getElementById('inst_code_spinner');
    
    if (!instCodeInput || !classSelect) return;
    
    instCodeInput.addEventListener('blur', function() {
        const code = this.value.trim();
        if (code.length < 3) return;
        
        spinner.classList.remove('d-none');
        classSelect.innerHTML = '<option value="" disabled selected>Loading...</option>';
        classSelect.disabled = true;
        
        fetch('/api/get_classes/' + encodeURIComponent(code))
            .then(res => res.json())
            .then(data => {
                classSelect.innerHTML = '<option value="" disabled selected>Select your class...</option>';
                if (data.classes && data.classes.length > 0) {
                    data.classes.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        classSelect.appendChild(opt);
                    });
                    classSelect.disabled = false;
                } else {
                    classSelect.innerHTML = '<option value="" disabled selected>No classes found for this code.</option>';
                }
            })
            .catch(err => {
                classSelect.innerHTML = '<option value="" disabled selected>Error fetching classes.</option>';
            })
            .finally(() => {
                spinner.classList.add('d-none');
            });
    });
});
</script>
{% endblock %}
