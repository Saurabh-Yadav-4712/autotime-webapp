{% extends 'shared/base.html' %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card p-5 border-0 shadow-lg w-100" style="max-width: 500px;">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-key fs-2"></i>
            </div>
            <h3 class="fw-bold text-main">Forgot Password</h3>
            <p class="text-muted small">Enter your email address to reset your password.</p>
        </div>

        <form action="/forgot_password" method="POST">
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Send Reset Link / OTP</button>
        </form>
        <div class="text-center">
            <a href="/login" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
