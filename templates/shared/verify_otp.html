{% extends 'shared/base.html' %}
{% set is_public_page = true %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card p-5 border-0 shadow-lg w-100" style="max-width: 450px;">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-envelope-check fs-2"></i>
            </div>
            <h3 class="fw-bold text-main">{{ title | default('Verify Email') }}</h3>
            <p class="text-muted small">{{ message | default("We've sent a 6-digit OTP to your email. Please enter it below to verify.") }}</p>
        </div>

        <form action="{{ submit_url }}" method="POST">
            <div class="mb-4">
                <label class="form-label text-center d-block">Enter OTP</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-123"></i></span>
                    <input type="text" name="otp" class="form-control text-center fs-4 letter-spacing-custom" required maxlength="6" pattern="\d{6}" placeholder="------">
                </div>
            </div>
            
            {% if require_password %}
            <div class="mb-4">
                <label class="form-label text-center d-block">Set New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="new_password" class="form-control text-center fs-5" required minlength="8" maxlength="128" placeholder="Enter new password">
                </div>
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100 py-2">{{ btn_text | default('Verify') }}</button>
        </form>
    </div>
</div>
{% endblock %}
