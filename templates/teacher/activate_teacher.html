{% extends 'shared/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 border-top border-success border-4">
            <div class="card-body p-5 text-center">
                <h1 class="display-4 mb-3">🔐</h1>
                <h3 class="fw-bold text-success mb-3">Activate Account</h3>
                <p class="text-muted small mb-4">Enter your registered email and Institute Code to receive a 6-digit verification OTP.</p>
                
                <form method="POST" action="/activate_teacher">
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold small text-muted">INSTITUTE CODE</label>
                        <input type="text" class="form-control bg-light border-0" name="inst_code" required>
                    </div>
                    <div class="mb-4 text-start">
                        <label class="form-label fw-bold small text-muted">REGISTERED EMAIL</label>
                        <input type="email" class="form-control bg-light border-0" name="email" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 fw-bold fs-5 mb-3">Send OTP</button>
                    <a href="/" class="text-secondary text-decoration-none small">Cancel & Go Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
