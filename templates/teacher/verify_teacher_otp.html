{% extends 'shared/base.html' %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card p-5 border-0 shadow-lg w-100" style="max-width: 500px;">
        <div class="text-center mb-4">
            <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-shield-check fs-2"></i>
            </div>
            <h3 class="fw-bold text-main">Set Password</h3>
            <p class="text-muted small">Enter the 6-digit OTP sent to your email and set your new password.</p>
        </div>

        <form action="/verify_teacher_otp" method="POST">
            <div class="mb-3">
                <label class="form-label">OTP Code</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-123"></i></span>
                    <input type="text" name="otp" class="form-control text-center letter-spacing-custom" required maxlength="6" pattern="\d{6}" placeholder="------">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="new_password" id="teachSetPwd" class="form-control border-end-0" required minlength="6">
                    <span class="input-group-text bg-white toggle-password border-start-0" data-target="teachSetPwd">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 mb-3">Activate & Set Password</button>
        </form>
        <div class="text-center">
            <a href="/activate_teacher" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>Back to Activation</a>
        </div>
    </div>
</div>
{% endblock %}
