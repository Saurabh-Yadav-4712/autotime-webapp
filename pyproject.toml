[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".verification-packages"]

[tool.ruff.lint]
# Keep CI focused on errors that can change runtime behaviour. Broader style
# adoption can then happen incrementally without obscuring correctness failures.
select = ["E9", "F63", "F7", "F82"]
