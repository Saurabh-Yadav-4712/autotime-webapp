{% extends 'shared/base.html' %}
{% block content %}
<div class="container auth-container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold brand-font text-success">Reset Password</h3>
                    <p class="text-muted small">Enter the OTP sent to <strong>{{ email }}</strong> and your new password.</p>
                </div>
                
                <form action="/reset_password" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">OTP Code</label>
                        <input type="text" name="otp" class="form-control bg-light" required placeholder="e.g., 123456" maxlength="6">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">New Password</label>
                        <input type="password" name="new_password" class="form-control bg-light" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-3">Reset Password</button>
                </form>
                
                <div class="text-center">
                    <a href="/" class="text-decoration-none text-muted small">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
