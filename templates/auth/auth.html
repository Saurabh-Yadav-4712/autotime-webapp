{% extends 'shared/base.html' %}
{% block content %}
<div class="container auth-container">
    <div class="glass-card p-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold brand-font">Welcome to AutoTime</h2>
            <p class="text-muted">Smart Timetable Management System</p>
        </div>

        <ul class="nav nav-tabs nav-tabs-custom justify-content-center mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab" aria-controls="admin" aria-selected="true">Admin</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="teacher-tab" data-bs-toggle="tab" data-bs-target="#teacher" type="button" role="tab" aria-controls="teacher" aria-selected="false">Teacher</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="student-tab" data-bs-toggle="tab" data-bs-target="#student" type="button" role="tab" aria-controls="student" aria-selected="false">Student</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            
            <!-- ADMIN TAB -->
            <div class="tab-pane fade show active" id="admin" role="tabpanel" aria-labelledby="admin-tab">
                <h5 class="fw-bold text-center mb-3">Admin Login</h5>
                <form action="/login_admin" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control bg-light" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control bg-light" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">Login as Admin</button>
                </form>
                <div class="text-center">
                    <p class="small text-muted">New Institute? <a href="/register_institute" class="text-primary text-decoration-none fw-bold">Register Here</a></p>
                </div>
            </div>

            <!-- TEACHER TAB -->
            <div class="tab-pane fade" id="teacher" role="tabpanel" aria-labelledby="teacher-tab">
                <h5 class="fw-bold text-center mb-3">Teacher Login</h5>
                <form action="/login_teacher" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control bg-light" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control bg-light" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">Login as Teacher</button>
                </form>
                <div class="text-center">
                    <p class="small text-muted">First time logging in? <a href="/activate_teacher" class="text-success text-decoration-none fw-bold">Activate Account (OTP)</a></p>
                </div>
            </div>

            <!-- STUDENT TAB -->
            <div class="tab-pane fade" id="student" role="tabpanel" aria-labelledby="student-tab">
                <h5 class="fw-bold text-center mb-3">Student Login</h5>
                <form action="/login_student" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control bg-light" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control bg-light" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">Login as Student</button>
                </form>
                <div class="text-center">
                    <p class="small text-muted">New Student? <a href="/register_student" class="text-primary text-decoration-none fw-bold">Register Here</a></p>
                </div>
            </div>
        </div>

        <div class="text-center mt-4 border-top pt-3">
            <a href="/forgot_password" class="text-danger text-decoration-none fw-bold small">Forgot Password?</a>
        </div>
    </div>
</div>
{% endblock %}
