{% extends 'shared/base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h2>🔔 My Notifications</h2>
        {% if notifications %}
        <form action="/clear_teacher_notifications" method="POST" class="m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash3 me-1"></i> Clear All</button>
        </form>
        {% endif %}
    </div>
    <div class="list-group mt-3">
        {% for notif in notifications %}
        <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-start shadow-sm mb-2 rounded border-left-info">
            <div class="ms-2 me-auto">
                <div class="fw-bold">Timetable Alert</div>
                {{ notif.message }}
            </div>
            <span class="badge bg-info rounded-pill text-dark">{{ notif.created_at.strftime('%d %b %H:%M') }}</span>
        </div>
        {% else %}
        <div class="alert alert-info">You have no new notifications.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
