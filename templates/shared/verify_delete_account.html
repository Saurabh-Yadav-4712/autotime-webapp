{% extends 'shared/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg border-top border-danger border-4">
                <div class="card-header bg-white pt-4 pb-0 border-0 text-center">
                    <div class="display-4 text-danger mb-3"><i class="bi bi-shield-lock"></i></div>
                    <h3 class="fw-bold mb-1">Final Confirmation</h3>
                    <p class="text-muted small">Enter the 6-digit OTP sent to your email to confirm deletion.</p>
                </div>
                <div class="card-body p-4">
                    <form action="/settings/delete_account/confirm" method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Verification OTP</label>
                            <input type="text" name="otp" class="form-control text-center fs-4 tracking-widest" maxlength="6" required placeholder="------" pattern="\d{6}">
                            <div class="form-text text-center mt-2">Check your inbox/spam folder.</div>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mb-3">Permanently Delete Account</button>
                        <div class="text-center">
                            <a href="/settings" class="text-decoration-none text-muted small">Cancel and go back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
