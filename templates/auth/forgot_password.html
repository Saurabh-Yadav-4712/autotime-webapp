{% extends 'shared/base.html' %}
{% block content %}
<div class="container auth-container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold brand-font text-primary">Forgot Password?</h3>
                    <p class="text-muted small">Enter your email and role to receive an OTP.</p>
                </div>
                
                <form action="/forgot_password" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Role</label>
                        <select name="role" class="form-select bg-light" required>
                            <option value="admin">Admin</option>
                            <option value="teacher">Teacher</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control bg-light" required placeholder="name@example.com">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Send Reset OTP</button>
                </form>
                
                <div class="text-center">
                    <a href="/" class="text-decoration-none text-muted small">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
