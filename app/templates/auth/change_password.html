{% extends 'shared/base.html' %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card p-5 border-0 shadow-lg w-100" style="max-width: 450px;">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-shield-lock fs-2"></i>
            </div>
            <h3 class="fw-bold text-main">Change Password</h3>
            <p class="text-muted small">Enter your current password to update it.</p>
        </div>

        <form action="/change_password" method="POST">
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" name="old_password" id="oldPwd" class="form-control border-end-0" required>
                    <span class="input-group-text bg-white toggle-password border-start-0" data-target="oldPwd">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="new_password" id="newPwd" class="form-control border-end-0" required minlength="6">
                    <span class="input-group-text bg-white toggle-password border-start-0" data-target="newPwd">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Update Password</button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary w-100 py-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
