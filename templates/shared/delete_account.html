{% extends 'shared/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg border-top border-danger border-4">
                <div class="card-header bg-white pt-4 pb-0 border-0 text-center">
                    <div class="display-4 text-danger mb-3"><i class="bi bi-exclamation-triangle"></i></div>
                    <h3 class="fw-bold mb-1">Delete Account</h3>
                    <p class="text-muted small">This action is permanent and cannot be undone.</p>
                </div>
                <div class="card-body p-4">
                    <form action="/settings/delete_account/send_otp" method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Confirm your Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" name="password" id="delPwd" class="form-control border-end-0" required placeholder="Enter your current password">
                                <span class="input-group-text bg-white toggle-password border-start-0" data-target="delPwd" style="cursor: pointer;">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="/settings" class="btn btn-light w-50 fw-bold">Cancel</a>
                            <button type="submit" class="btn btn-danger w-50 fw-bold">Send OTP</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
