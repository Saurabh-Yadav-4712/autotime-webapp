{% extends 'shared/base.html' %}
{% block content %}
<div class="container-fluid px-0">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-3 pb-3 border-bottom">
        <div>
            <h2 class="fw-bold text-primary mb-1 d-flex align-items-center"><i class="bi bi-people me-2"></i> Class Timetables</h2>
            <small class="text-muted">Teacher View</small>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Read-Only Course Viewer -->
            <div class="card border-0 border-top border-primary border-4 shadow-sm mb-4">
                <div class="card-body p-5 bg-light-custom">
                    <h4 class="fw-bold mb-3 d-flex align-items-center text-dark"><i class="bi bi-building text-primary me-2"></i> Course Viewer</h4>
                    <p class="text-muted mb-4">Select a class to view their complete live schedule. Useful for coordinating free slots or proxy arrangements.</p>
                    <form action="/teacher_view_class" method="GET">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Select Class</label>
                            <select name="class_id" class="form-select form-select-lg bg-white shadow-sm" required>
                                <option value="" selected disabled>Select Class...</option>
                                {% for course in courses %}
                                    <option value="{{ course.class_id }}">{{ course.class_id }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                            <i class="bi bi-eye me-2"></i> View Timetable
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
