name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py models.py routes utils migrations

      - name: Check for runtime lint errors
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.txt
